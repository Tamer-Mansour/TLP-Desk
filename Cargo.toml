[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-rc.6"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tlp-desk-proto = { path = "crates/tlp-desk-proto", version = "1.0.0-rc.6" }
tlp-desk-crypto = { path = "crates/tlp-desk-crypto", version = "1.0.0-rc.6" }
tlp-desk-net = { path = "crates/tlp-desk-net", version = "1.0.0-rc.6" }
tlp-desk-capture = { path = "crates/tlp-desk-capture", version = "1.0.0-rc.6" }
tlp-desk-codec = { path = "crates/tlp-desk-codec", version = "1.0.0-rc.6" }
tlp-desk-input = { path = "crates/tlp-desk-input", version = "1.0.0-rc.6" }
tlp-desk-audio = { path = "crates/tlp-desk-audio", version = "1.0.0-rc.6" }
tlp-desk-files = { path = "crates/tlp-desk-files", version = "1.0.0-rc.6" }
tlp-desk-host = { path = "crates/tlp-desk-host", version = "1.0.0-rc.6" }
tlp-desk-viewer = { path = "crates/tlp-desk-viewer", version = "1.0.0-rc.6" }
# Dev-only test harness; only ever a [dev-dependencies] entry.
tlp-desk-testkit = { path = "crates/tlp-desk-testkit" }
serde = { version = "1", features = ["derive"] }
# No default features: the default `heapless-cas` pulls heapless 0.7 and the unmaintained
# atomic-polyfill (RUSTSEC-2023-0089); we only use from_bytes/to_stdvec, which need neither.
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
anyhow = "1"

# Shared lint levels; every crate opts in with `[lints] workspace = true`.
# Rationale and the lints we plan to enable later: docs/CODE_STYLE.md, "Lints".
[workspace.lints.rust]
# `deny`, not `forbid`: platform modules (capture, input, codec FFI) opt back in with a local
# `#[allow(unsafe_code)]` and document every block with `// SAFETY:`. Pure crates keep
# `#![forbid(unsafe_code)]` in their lib.rs.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
mem_forget = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
