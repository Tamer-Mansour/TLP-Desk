[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tlp-desk-proto = { path = "crates/tlp-desk-proto" }
tlp-desk-crypto = { path = "crates/tlp-desk-crypto" }
tlp-desk-net = { path = "crates/tlp-desk-net" }
tlp-desk-capture = { path = "crates/tlp-desk-capture" }
tlp-desk-codec = { path = "crates/tlp-desk-codec" }
tlp-desk-input = { path = "crates/tlp-desk-input" }
tlp-desk-audio = { path = "crates/tlp-desk-audio" }
tlp-desk-files = { path = "crates/tlp-desk-files" }
tlp-desk-host = { path = "crates/tlp-desk-host" }
tlp-desk-viewer = { path = "crates/tlp-desk-viewer" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
