[package]
name = "tlp-desk-audio"
description = "System audio loopback and Opus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tlp-desk-proto.workspace = true
tlp-desk-net.workspace = true
thiserror.workspace = true
# Safe bindings to libopus (BSD-3-Clause). `opusic-sys` builds the bundled libopus 1.6 with
# CMake; the copy that ships with Visual Studio's C++ tools is enough on Windows.
opus = "0.4"
# Device I/O: WASAPI on Windows (an input stream on a render device = loopback capture).
cpal = "0.18"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tlp-desk-crypto.workspace = true
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
