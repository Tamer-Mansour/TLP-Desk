[package]
name = "tlp-desk-input"
description = "Input injection trait and platform implementations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tlp-desk-proto.workspace = true
thiserror.workspace = true
# Anti-aliased whiteboard strokes (host overlay and viewer). No PNG support needed.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # Privacy mode: is the input desktop the normal one (not lock screen / UAC)?
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux/X11: XTest injection and the viewer keyboard grab. RustConnection is pure Rust, so
# there is no libxcb build or run-time dependency.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["xtest", "xkb"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Quartz Event Services (CGEvent injection) and CoreFoundation types; pure-Rust bindings.
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
