[package]
name = "tlp-desk-app"
description = "TLP-Desk GUI application (host + viewer)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
postcard.workspace = true
tlp-desk-proto.workspace = true
tlp-desk-crypto.workspace = true
tlp-desk-net.workspace = true
tlp-desk-host.workspace = true
tlp-desk-viewer.workspace = true
tlp-desk-files.workspace = true
tlp-desk-input.workspace = true
tlp-desk-capture.workspace = true
tlp-desk-audio.workspace = true
if-addrs = "0.15"
raw-window-handle = "0.6"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
unicode-bidi = "0.3.18"
serde_json = "1"
tracing = "0.1"
# The service and agent processes log to a local file (service_entry).
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
sys-locale = "0.3"
# Local UTC offset for the file browser's "modified" column and chat timestamps (Windows: GetTimeZoneInformation).
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
# Rasterizes the vendored tlp-icons SVGs (ui::icons). No default features: icons have no text or
# embedded raster images, so no font database (fontdb/system fonts) is pulled in.
# Native file / folder picker for sending files (Win32 dialogs; no GTK or portals on Windows).
rfd = { version = "0.15", default-features = false }
resvg = { version = "0.48", default-features = false }
# In-app updates (update/): opt-in GitHub Releases check over HTTPS. rustls with ring (already
# used by quinn) and the OS certificate store (platform verifier), no bundled root list.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
semver = "1"
sha2 = "0.11"
# Verifies the release manifest signature (minisign format, ed25519); no dependencies.
minisign-verify = "0.3"
# Thumbnails of remote screens on the Remote devices page (remote::store), written as PNG.
png = "0.18"

[target.'cfg(windows)'.dependencies]
# HKCU Run key for "start with Windows" (settings::autostart). Safe API: this crate stays
# forbid(unsafe_code).
windows-registry = "0.100"
# Notification-area icon + menu (tray::system). No default features: they only add the Linux
# libappindicator backend (and an MPL-licensed dependency through dirs).
tray-icon = { version = "0.26", default-features = false }
# Accept popup (prompt::windows): work area, rounded corners, foreground, notification sound.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# rfd needs a backend on Linux: the xdg-desktop-portal file chooser (pure Rust over D-Bus, no
# GTK at build time; works on X11 and Wayland).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
# Encodes real H.264 for the playback window tests.
tlp-desk-codec.workspace = true
tempfile = "3"
# README media generator (`examples/readme_media`): renders the real UI headlessly with wgpu
# (`wgpu`) and drives `App` through a real `eframe::CreationContext` (`eframe`).
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Release signing (update::sign, examples/release_sign.rs): minisign-compatible signatures.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
blake2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "TLP-Desk"
path = "src/main.rs"
