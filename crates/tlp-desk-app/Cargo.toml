[package]
name = "tlp-desk-app"
description = "TLP-Desk GUI application (host + viewer)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
tlp-desk-proto.workspace = true
tlp-desk-crypto.workspace = true
tlp-desk-net.workspace = true
tlp-desk-host.workspace = true
tlp-desk-viewer.workspace = true
tlp-desk-input.workspace = true
if-addrs = "0.13"
raw-window-handle = "0.6"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
unicode-bidi = "0.3.18"
serde_json = "1"
tracing = "0.1"
sys-locale = "0.3"
# Rasterizes the vendored tlp-icons SVGs (ui::icons). No default features: icons have no text or
# embedded raster images, so no font database (fontdb/system fonts) is pulled in.
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
tlp-desk-capture.workspace = true
tempfile = "3"
# README media generator (`examples/readme_media`): renders the real UI headlessly with wgpu
# (`wgpu`) and drives `App` through a real `eframe::CreationContext` (`eframe`).
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "TLP-Desk"
path = "src/main.rs"
