[package]
name = "tlp-desk-viewer"
description = "Viewer session logic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tlp-desk-proto.workspace = true
tlp-desk-crypto.workspace = true
tlp-desk-net.workspace = true
tlp-desk-capture.workspace = true
tlp-desk-codec.workspace = true
tlp-desk-input.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
# Free disk space before/while recording (pure Rust, no libc; MIT OR Apache-2.0).
fs4 = "1"
# Local wall-clock time for recording file names ("local-offset" reads the time zone).
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
