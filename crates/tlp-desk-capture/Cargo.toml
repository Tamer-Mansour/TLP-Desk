[package]
name = "tlp-desk-capture"
description = "Screen capture trait and platform implementations"
version.workspace = true
edition.workspace = true
license.workspace = true
# windows 0.62 needs 1.82; openh264 (codec crate) needs 1.85.
rust-version = "1.85"

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

# Linux/X11 capture. RustConnection is pure Rust: no libxcb build or run-time dependency.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["randr", "xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Quartz Display Services (CGDisplayCreateImage) and CoreFoundation types; pure-Rust bindings.
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
