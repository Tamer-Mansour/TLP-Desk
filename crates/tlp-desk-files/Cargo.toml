[package]
name = "tlp-desk-files"
description = "File transfer and clipboard sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tlp-desk-proto.workspace = true
tlp-desk-net.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
# Clipboard image wire format (protocol v5 `ClipboardData::Png`).
png = "0.18"

[dev-dependencies]
tlp-desk-crypto.workspace = true
tokio = { version = "1", features = ["full"] }
