[package]
name = "tlp-desk-files"
description = "File transfer and clipboard sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tlp-desk-proto.workspace = true
tlp-desk-net.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
# Clipboard image wire format (protocol v5 `ClipboardData::Png`).
png = "0.18"
# System clipboard access (text, HTML, images, file lists).
arboard = "3.6"

[target.'cfg(windows)'.dependencies]
# Event-driven clipboard change notifications (AddClipboardFormatListener).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tlp-desk-crypto.workspace = true
tokio = { version = "1", features = ["full"] }
