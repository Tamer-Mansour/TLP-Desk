[package]
name = "tlp-desk-files"
description = "File transfer and clipboard sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tlp-desk-proto.workspace = true
tlp-desk-net.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# Drives (labels, size, free space) and known folders (Desktop, Documents, ...) for the remote
# file browser's starting points; wrapped in `fs::windows`, the crate's only unsafe module.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
# CF_HDROP (files copied in Explorer) for clipboard file sharing. No default features: we only
# read file lists, never images.
arboard = { version = "3.6", default-features = false }

[dev-dependencies]
tlp-desk-crypto.workspace = true
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
proptest = "1"
