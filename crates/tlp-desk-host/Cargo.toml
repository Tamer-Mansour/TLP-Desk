[package]
name = "tlp-desk-host"
description = "Host session logic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tlp-desk-proto.workspace = true
tlp-desk-crypto.workspace = true
tlp-desk-net.workspace = true
tlp-desk-capture.workspace = true
tlp-desk-codec.workspace = true
tlp-desk-input.workspace = true
thiserror.workspace = true
# Device info (OS, CPU, RAM, disks, uptime). MIT; only the system + disk parts are compiled.
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tlp-desk-viewer.workspace = true
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
