[package]
name = "tlp-desk-host"
description = "Host session logic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tlp-desk-proto.workspace = true
tlp-desk-crypto.workspace = true
tlp-desk-net.workspace = true
tlp-desk-capture.workspace = true
tlp-desk-codec.workspace = true
tlp-desk-input.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tlp-desk-viewer.workspace = true
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
