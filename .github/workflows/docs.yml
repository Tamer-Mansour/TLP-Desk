# Builds the documentation book (docs/, mdBook) and the static landing page (docs/site/) on every
# change to them, and publishes both to GitHub Pages from the main branch: the landing page at the
# Pages root and the book under /book/. Pull requests only build, so broken SUMMARY entries or
# includes are caught before merge. Needs Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: ["TLP-Desk"]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: ["TLP-Desk"]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same mdBook version the book was written and checked with (docs/book.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      # User-guide pages show the generated screenshots as ../../media/<file>.png: copy
      # docs/media (the only tracked copy) into the book source; docs/src/media is git-ignored.
      - name: Copy README media into the book
        run: cp -r docs/media docs/src/media

      # book.toml writes to target/book (git-ignored) and fails on missing pages.
      - name: Build
        run: mdbook build docs

      # The landing page (docs/site/index.html + ar.html, plain HTML and CSS) must stay
      # self-contained: the only absolute links allowed are to this repository on GitHub.
      - name: Check the landing page has no external resources
        run: |
          if grep -nE '(src|href)="(https?:)?//' docs/site/*.html | grep -v 'https://github.com/Tamer-Mansour/TLP-Desk'; then
            echo "docs/site must not load or link external resources" >&2
            exit 1
          fi
          if grep -nE '<script|@import|url\(http' docs/site/*.html docs/site/style.css; then
            echo "docs/site must not use scripts or imports" >&2
            exit 1
          fi

      # Pages root = landing page; the book lives under /book/; screenshots under /media/. The
      # pages reference ../media/ so they preview from the repository; rewrite for the site.
      - name: Assemble the site
        run: |
          mkdir -p _site/book
          cp -r target/book/. _site/book/
          cp docs/site/*.html docs/site/style.css _site/
          cp -r docs/media _site/media
          sed -i 's#\.\./media/#media/#g' _site/index.html _site/ar.html
          test -f _site/index.html && test -f _site/ar.html && test -f _site/book/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/TLP-Desk'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
