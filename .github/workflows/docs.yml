# Builds the documentation book (docs/, mdBook) on every change to it, and publishes it to
# GitHub Pages from the main branch. Pull requests only build, so broken SUMMARY entries or
# includes are caught before merge. Needs Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: ["TLP-Desk"]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: ["TLP-Desk"]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same mdBook version the book was written and checked with (docs/book.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      # User-guide pages show the generated screenshots as ../../media/<file>.png: copy
      # docs/media (the only tracked copy) into the book source; docs/src/media is git-ignored.
      - name: Copy README media into the book
        run: cp -r docs/media docs/src/media

      # book.toml writes to target/book (git-ignored) and fails on missing pages.
      - name: Build
        run: mdbook build docs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/TLP-Desk'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
