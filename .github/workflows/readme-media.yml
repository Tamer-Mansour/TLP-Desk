# Keeps the README / docs screenshots and demo video in docs/media/ in sync with the UI.
# Runs scripts/update-readme-media.ps1 (headless render on the WARP software adapter, then
# ffmpeg); if anything in docs/media/ changed, opens or refreshes the PR
# "TLP-media: refresh README screenshots and demo" from branch TLP-media-refresh.
# The PR rule in CLAUDE.md ("README media") still asks UI PRs to regenerate media themselves;
# this workflow is the safety net that catches anything that slipped through.
name: README media

on:
  push:
    branches: ["TLP-Desk"]
    paths:
      - "crates/tlp-desk-app/**"
      - "docs/media/**"
      - "scripts/update-readme-media.ps1"
      - "Cargo.lock"
  # On PRs: regenerate and report (warning + artifact) without failing, so reviewers see whether
  # the PR forgot to update docs/media and CI keeps proving that headless rendering works.
  pull_request:
    branches: ["TLP-Desk"]
    paths:
      - "crates/tlp-desk-app/**"
      - "docs/media/**"
      - "scripts/update-readme-media.ps1"
      - ".github/workflows/readme-media.yml"
  workflow_dispatch:

concurrency:
  group: readme-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  refresh:
    name: Regenerate docs/media
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # openh264 uses NASM for its assembly fast paths.
      - uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: readme-media

      - name: Install ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      # Headless wgpu prefers the CPU adapter (WARP on Windows), so no GPU is needed and the
      # pixels match a developer's run of the same script.
      - name: Regenerate media
        shell: pwsh
        run: ./scripts/update-readme-media.ps1 -RawDir "$env:RUNNER_TEMP\tlp-desk-media-raw"

      - name: Show changes
        id: diff
        shell: pwsh
        run: |
          git add -N docs/media
          $changed = git status --porcelain docs/media
          $changed | Write-Host
          if ($changed) {
            "changed=true" >> $env:GITHUB_OUTPUT
            if ('${{ github.event_name }}' -eq 'pull_request') {
              Write-Host "::warning::docs/media is out of date for this PR. Run scripts/update-readme-media.ps1 and commit docs/media (regenerated files are in the readme-media artifact)."
            }
          }

      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: readme-media
          path: docs/media/

      # peter-evans/create-pull-request v8.1.1
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        if: github.event_name != 'pull_request'
        with:
          branch: TLP-media-refresh
          base: TLP-Desk
          add-paths: docs/media/**
          commit-message: |
            TLP-media: refresh README screenshots and demo

            Regenerated by .github/workflows/readme-media.yml (scripts/update-readme-media.ps1).
          title: "TLP-media: refresh README screenshots and demo"
          body: |
            The UI changed and `docs/media/` was out of date. This PR was generated by the
            **README media** workflow running `scripts/update-readme-media.ps1` on
            `${{ github.sha }}`. Review the images in the diff, then merge.
          delete-branch: true
