# Quality gate for every lane branch and every pull request into TLP-Desk.
# Same steps as scripts/check.ps1: fmt, clippy -D warnings, tests, release build.
# Tests that need a real desktop (screen capture, input injection) or LAN multicast are #[ignore]
# and stay ignored here.
name: CI

on:
  push:
    branches: ["TLP-*"]
  pull_request:
    branches: ["TLP-Desk"]
  workflow_dispatch:

# A newer push to the same branch / PR cancels the outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Windows (fmt, clippy, test, release build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Versions come from rust-toolchain.toml (stable + clippy + rustfmt).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # openh264 uses NASM for its assembly fast paths.
      - uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release --workspace

  macos:
    name: macOS (clippy, test, app bundle)
    runs-on: macos-latest
    timeout-minutes: 60
    # The macOS port was written without access to a Mac (cross-checked with
    # `cargo check --target aarch64-apple-darwin` for proto/input/capture only), so the first
    # runs may expose build errors in the other crates. Drop this line once the job is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Tests that need Screen Recording / Accessibility or a real display are #[ignore].
      - name: Test
        run: cargo test --workspace

      - name: App bundle
        run: installer/macos/build-app.sh "$RUNNER_TEMP/tlp-desk-macos"

  linux:
    name: Linux (clippy, test, X11 under Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # alsa: cpal audio; cmake: bundled libopus; nasm: openh264 assembly. The X11 backends use
      # the pure-Rust x11rb and the GUI loads Vulkan/GL/X11 at run time, so nothing else is
      # needed to build. xvfb + xauth run the X11 tests below.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libasound2-dev pkg-config cmake nasm xvfb xauth x11-utils

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Real X11 capture, XTest injection and keyboard-grab connection against a virtual
      # display. Nothing touches a real screen; `--ignored` selects only the X11 tests.
      - name: X11 tests (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension XTEST +extension RANDR"             cargo test -p tlp-desk-capture -p tlp-desk-input -- --ignored x11 connects_and_releases

      - name: Release build
        run: cargo build --release --workspace

  hygiene:
    name: Spelling and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,cargo-deny

      # Config: .typos.toml
      - name: Spelling (typos)
        run: typos

      # Config: .cargo/deny.toml (licences, sources, bans, advisories)
      - name: Dependency policy (cargo deny)
        run: cargo deny check
