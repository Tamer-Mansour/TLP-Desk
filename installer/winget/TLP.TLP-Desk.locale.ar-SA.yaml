ShortDescription: 'سطح مكتب بعيد مجاني ومفتوح المصدر لشبكتك المحلية: بلا سحابة ولا حساب ولا تتبُّع.'
Description: |-
  يتيح لك TLP-Desk رؤية حاسوب آخر في شبكتك المحلية نفسها والتحكم فيه. يعمل دون إنترنت بالكامل: فلا
  خدمة سحابية ولا خادم وسيط ولا حساب ولا جمع بيانات، ويواصل العمل حتى بعد فصل الإنترنت. والبرنامج
  نفسه يعمل جهازًا مضيفًا وجهاز عرض معًا.
  - يعثر على الأجهزة في الشبكة تلقائيًا، أو يتصل بمعرّف الجهاز المكوّن من 9 أرقام أو باسمه أو بعنوان IP
  - كل اتصال مشفَّر بـ QUIC وTLS 1.3، ومعرّف الجهاز يثبّت مفتاح الجهاز المضيف
  - لا تبدأ الجلسة إلا إذا نقر مستخدم الجهاز المضيف «قبول»، أو أدخل جهاز العرض الرمز لمرة واحدة، أو
    بكلمة مرور الوصول غير المراقَب
  - فيديو H.264 سلس حتى 60 إطارًا في الثانية، وتعدد الشاشات، ونقل الملفات، ومشاركة الحافظة،
    والمحادثة، وصوت الحاسوب البعيد
  - واجهة كاملة بالعربية والإنجليزية
