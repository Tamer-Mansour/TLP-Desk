ShortDescription: 'Free, open-source remote desktop for your local network: no cloud, no account, no telemetry.'
Description: |-
  TLP-Desk lets you see and control another PC on the same local network. It works entirely
  offline: there is no cloud service, relay server, account or telemetry, and it keeps working with
  the internet unplugged. The same app is both the host and the viewer.
  - Finds devices on the network automatically, or connects by 9-digit device ID, name or IP address
  - Every connection is encrypted with QUIC and TLS 1.3, and the device ID pins the host's key
  - A session starts only when the host user clicks Accept, the viewer enters the host's one-time
    code, or with an unattended-access password
  - Smooth H.264 video up to 60 fps, multiple monitors, file transfer, clipboard sharing, chat and
    sound from the remote PC
  - Complete Arabic and English interface
