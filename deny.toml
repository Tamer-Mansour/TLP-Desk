# cargo-deny policy. Run: `cargo deny check` (install once with `cargo install cargo-deny --locked`).
# Dependencies follow the same rule as code: permissive licences only. Copyleft (GPL, AGPL, LGPL,
# MPL) is never linked into tlp-desk. See docs/CODE_STYLE.md, "Dependencies".

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]

# egui's built-in UI fonts are open font licences, allowed for this one crate only.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
# Duplicate versions are common in the egui/wgpu/windows graph; report them, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only. A git dependency must be added here with a pinned `rev` in Cargo.toml.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[advisories]
yanked = "warn"
ignore = [
    # "Unmaintained", not a vulnerability. Pulled in by postcard 1.x through heapless 0.7, which
    # only uses it on targets without native atomics; x86_64 never compiles that code. Revisit when
    # postcard moves to heapless 0.8+.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via postcard/heapless; unused on x86_64" },
]
